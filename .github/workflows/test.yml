name: Stream_Pro_TV_Style

on:
  schedule:
    # Chạy 3 tiếng một lần. Chú ý: Nên để lệnh cron an toàn
    - cron: '0 */3 * * *' 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    # Thêm timeout để tránh việc Job bị treo lãng phí tài khoản
    timeout-minutes: 350 # 350 phút ~ 5 tiếng 50 phút
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Live Now
        env:
          STREAM_KEY: ${{ secrets.TWITCH_KEY_4}}
        run: |
          SOURCE="https://vpsttt.vietanhtv.top/tv360/tv360.php?id=8"
          
          # Dùng timeout của lệnh để đảm bảo job tự kết thúc trước giới hạn 6h
          # Chạy trong 5 tiếng 40 phút (20400 giây)
          timeout 20400 ffmpeg -re \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
            -reconnect_delay_max 5 -rw_timeout 20000000 \
            -headers "Referer: https://vietanhtv.id.vn/"$'\r\n'"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"$'\r\n' \
            -i "$SOURCE" \
            -c:v libx264 -preset superfast -b:v 3000k -maxrate 3500k -bufsize 6000k \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 -f flv "rtmps://live.twitch.tv/app/$STREAM_KEY"
            
          echo "Đã kết thúc job an toàn."
