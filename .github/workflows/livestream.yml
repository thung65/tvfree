name: "Livestream IPTV Chạy Ngay - By Khoi"

on:
  push:
    branches: [ main ] # Cứ hễ Khôi nhấn "Commit" hoặc sửa code là nó chạy luôn
  schedule:
    - cron: '0 */5 * * *' # Vẫn giữ hẹn giờ để nó tự chạy lại sau mỗi 5 tiếng
  workflow_dispatch: # Tạo cái nút "Run workflow" để Khôi bấm chạy thủ công bất cứ lúc nào

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Start Streaming Now
        env:
          INPUT_URL: "https://vietanhtv.id.vn/tv360/32/index.m3u8"
          TWITCH_KEY: ${{ secrets.TWITCH_KEY }}
        run: |
          # Dùng vòng lặp để giữ luồng luôn sống trong 5 tiếng rưỡi
          timeout 5h30m bash -c 'while true; do
            ffmpeg -re -i "$INPUT_URL" \
            -c copy -f flv "rtmp://live.twitch.tv/app/$TWITCH_KEY"
            echo "Đang khởi động lại luồng sau 5 giây..."
            sleep 5
          done'
