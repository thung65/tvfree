name: Live3h
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: sudo apt update && sudo apt install ffmpeg -y
      - name: Run
        run: |
          timeout 2h55m bash -c 'while true; do
            ffmpeg -re -i "https://vietanhtv.id.vn/tv360/32/index.m3u8" -c copy -f flv "rtmp://live.twitch.tv/app/live_1436661130_ZlbRQTC3GRCviGsoMV9QV1nh14CkoY"
            sleep 10
          done'
