name: Stream_Pro_TV_Style

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Live
        env:
          # Đây là chỗ quan trọng nhất: Gọi đúng tên TWITCH_STREAM_KEY của Khôi
          MY_SECRET: ${{ secrets.TWITCH_STREAM_KEY }}
        run: |
          SOURCE_URL="https://vietanhtv.id.vn/tv360/32/index.m3u8"
          
          # Chạy trong 2 giờ 55 phút để bản sau tự động nối vào
          timeout 2h55m bash -c "while true; do
            ffmpeg -re -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -headers 'Referer: https://vietanhtv.id.vn/' \
            -i '$SOURCE_URL' \
            -c:v libx264 -preset veryfast -b:v 2500k -pix_fmt yuv420p -g 50 \
            -c:a aac -b:a 128k -ar 44100 -f flv \
            'rtmp://live.twitch.tv/app/$MY_SECRET'
            echo 'Đang khởi động lại luồng sau 10 giây...'
            sleep 10
          done"
