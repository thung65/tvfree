name: "Livestream IPTV Chay Ngay - By Khoi"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *' # Khôi nên để 3 tiếng để tránh bị GitHub soi quá kỹ
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Start Streaming Now
        env:
          INPUT_URL: "https://vietanhtv.id.vn/tv360/32/index.m3u8"
          # Nhớ phải có dấu cách sau dấu { và trước dấu } như thế này:
          TWITCH_KEY: ${{ secrets.TWITCH_STREAM_KEY }}
        run: |
          # Chỉnh lại timeout 2h55m để khớp với cron 3 tiếng (Tránh bị trùng luồng)
          timeout 2h55m bash -c 'while true; do
            ffmpeg -re -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -headers "Referer: https://vietanhtv.id.vn/" \
            -i "$INPUT_URL" \
            -c copy -f flv "rtmp://live.twitch.tv/app/$TWITCH_KEY"
            echo "Đang khởi động lại luồng sau 10 giây..."
            sleep 10
          done'
