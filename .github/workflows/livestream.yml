name: Stream_Pro_TV_Style

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push: # Thêm cái này để Khôi nhấn Lưu là nó chạy thử ngay

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Live
        env:
          # Phải dùng đúng cái tên TWITCH_STREAM_KEY như trong ảnh của Khôi
          KHOI_SECRET: ${{ secrets.TWITCH_STREAM_KEY }}
        run: |
          SOURCE_URL="https://vietanhtv.id.vn/tv360/32/index.m3u8"
          
          # Dùng timeout để bản cũ tự nghỉ sau 2h55m cho bản mới vào thay
          timeout 2h55m bash -c "while true; do
            ffmpeg -re -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -headers 'Referer: https://vietanhtv.id.vn/' \
            -i '$SOURCE_URL' \
            -c:v libx264 -preset veryfast -b:v 2500k -pix_fmt yuv420p -g 50 \
            -c:a aac -b:a 128k -ar 44100 -f flv \
            'rtmp://live.twitch.tv/app/$KHOI_SECRET'
            sleep 10
          done"
