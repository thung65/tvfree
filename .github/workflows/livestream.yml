name: Stream_Pro_TV_Style_32

on:
  schedule:
    - cron: '0 */6 * * *' # Cứ mỗi 6 tiếng nó tự kiểm tra và chạy lại
  workflow_dispatch:
  workflow_call:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Giới hạn cứng 5h50m để job tự ngắt
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Live Stream
        env:
          STREAM_KEY: ${{ sểcts.TWITCH_KEY }}
        run: |
          SOURCE="https://tpninosaga.duckdns.org/source/tv360.m3u8?id=32&token=NinoExility"
          
          # Dùng timeout của hệ thống thay vì vòng lặp bash để tránh treo tiến trình
          # 20000 giây = ~5.5 tiếng
          timeout 20000 ffmpeg -re \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
            -reconnect_delay_max 5 -rw_timeout 20000000 \
            -headers "Referer: https://vietanhtv.id.vn/"$'\r\n'"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"$'\r\n' \
            -i "$SOURCE" \
            -c:v libx264 -preset superfast -b:v 3000k -maxrate 3500k -bufsize 6000k \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 -f flv "rtmps://live.twitch.tv/app/$STREAM_KEY"
          
          echo "Stream đã tự động ngắt sau thời gian quy định."
