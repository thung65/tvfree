name: Stream_IPTV_247

on:
  schedule:
    - cron: '0 */3 * * *' # Tự động khởi động lại mỗi 3 tiếng
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Live
        env:
          TWITCH_KEY: ${{ secrets.TWITCH_KEY }}
        run: |
          # Link nguồn TV360 hoặc MPD của bạn
          SOURCE_URL="https://vietanhtv.id.vn/tv360/32/index.m3u8"
          
          # Vòng lặp tự khởi động lại nếu bị ngắt giữa chừng
          while true; do
            echo "Đang đẩy luồng lên Twitch..."
            
            ffmpeg -re -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$SOURCE_URL" \
            -c:v libx264 -preset veryfast -b:v 2500k -pix_fmt yuv420p -g 50 \
            -c:a aac -b:a 128k -ar 44100 -f flv \
            "rtmp://live.twitch.tv/app/$TWITCH_KEY"
            
            echo "Luồng tạm dừng. Chờ 5 giây để phát lại..."
            sleep 5
          done
