name: Stream_Pro_TV_Style

on:
  schedule:
    - cron: '0 */3 * * *' # Tự động chạy lại mỗi 3 tiếng để tránh giới hạn của GitHub
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg Super Fast (Static Binary)
        # Tải trực tiếp file chạy sẵn từ kho lưu trữ release, giải nén và ném thẳng vào hệ thống
        run: |
          mkdir -p $HOME/ffmpeg
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ --strip-components=1 -C $HOME/ffmpeg
          echo "$HOME/ffmpeg/bin" >> $GITHUB_PATH

      - name: Live Now
        env:
          K: ${{ secrets.TWITCH_KEY }}
        run: |
          SOURCE="https://sgclient.duckdns.org/source/tv360.m3u8?id=32"
          
          end=$((SECONDS + 10200)) # Chạy trong 2 tiếng 50 phút
          
          while [ $SECONDS -lt $end ]; do
            echo "========== Khởi động luồng phát FFmpeg mới =========="
            
            ffmpeg -re \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_delay_max 10 -rw_timeout 15000000 \
              -headers "Referer: https://vietanhtv.id.vn/"$'\r\n'"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"$'\r\n' \
              -i "$SOURCE" \
              -c:v libx264 -preset superfast -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://live.twitch.tv/app/$K"
            
            echo "Mất kết nối với server gốc hoặc Twitch. Đang chuẩn bị thử lại sau 5 giây..."
            sleep 5
          done
          
          echo "Đã hết thời gian chạy an toàn 2h50m. Đóng job để đợi chu kỳ cron tiếp theo kích hoạt."
