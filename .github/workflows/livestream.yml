Name: Stream_Pro_TV_Style

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Live
        env:
          TWITCH_KEY: ${{ secrets.TWITCH_KEY }}
        run: |
          # Link nguồn TV360
          SOURCE_URL="https://vietanhtv.id.vn/tv360/32/index.m3u8"
          
          # Chạy FFmpeg:
          # -reconnect: Tự động kết nối lại nếu mạng lag nhẹ
          # Không dùng -vf (filter) để bỏ hoàn toàn đồng hồ và logo
          ffmpeg -re -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
          -i "$SOURCE_URL" \
          -c:v libx264 -preset veryfast -b:v 2500k -pix_fmt yuv420p -g 50 \
          -c:a aac -b:a 128k -ar 44100 -f flv \
          "rtmp://live.twitch.tv/app/$TWITCH_STREAM_KEY"
