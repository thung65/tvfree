name: FFmpeg GitHub M3U8
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *' # Tự động chạy lại mỗi 3 tiếng

jobs:
  ffmpeg-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Force Generate M3U8
        run: |
          # Thêm -fflags +genpts để tự tạo mốc thời gian nếu luồng bị lỗi
          # Thems -hls_flags independent_segments để TV dễ đọc hơn
          
          ffmpeg -hide_banner -loglevel error \
          -protocol_whitelist file,http,https,tcp,tls \
          -headers "Referer: https://vietanhtv.id.vn/" \
          -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
          -i "https://vietanhtv.id.vn/tv360/32/index.m3u8" \
          -t 60 -c copy -absf aac_adtstoasc \
          -fflags +genpts \
          -f hls -hls_time 10 -hls_list_size 6 -hls_flags delete_segments+independent_segments \
          -y index.m3u8

      - name: Commit and Push to Public
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.m3u8
          # Đẩy file lên để TV có link raw để đọc
          git commit --allow-empty -m "Update M3U8: $(date)"
          git push
