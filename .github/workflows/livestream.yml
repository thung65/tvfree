name: Stream_Pro_TV_Style

on:
  schedule:
    # Tự động chạy lại mỗi 3 tiếng để dọn cache và làm mới luồng phát
    - cron: '0 */3 * * *' 
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg Fast
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Live Now
        env:
          STREAM_KEY: ${{ secrets.TWITCH_KEY }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "⚠️ Lỗi: Không tìm thấy Secret TWITCH_KEY."
            exit 1
          fi

          SOURCE="https://sgclient.duckdns.org/source/tv360.m3u8?id=32"
          
          # Đặt tổng thời gian chạy cho toàn bộ bước này là 2 tiếng 50 phút
          end=$((SECONDS + 10200))
          
          echo "========== Khởi động hệ thống phát trực tiếp siêu nhẹ =========="
          
          # Vòng lặp chuẩn mã nguồn Linux, bọc biến cẩn thận chống sập Job ngang
          while [ "$SECONDS" -lt "$end" ]
          do
            echo "---- [$(date +'%H:%M:%S')] Đang tiến hành đẩy luồng sang Twitch ----"
            
            # 🚀 CẤU HÌNH SIÊU NHẸ: Đã bật -loglevel error và chuyển hoàn toàn sang -c:v copy
            ffmpeg -re -loglevel error \
              -fflags +genpts+discardcorrupt \
              -analyzeduration 1500000 -probesize 1000000 \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_delay_max 10 -rw_timeout 15000000 \
              -headers "Referer: https://vietanhtv.id.vn/"$'\r\n'"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              -i "$SOURCE" \
              -c:v copy -c:a copy \
              -f flv "rtmps://live.twitch.tv/app/$STREAM_KEY"
            
            echo "⚠️ Cảnh báo: Mất kết nối luồng hoặc bị Twitch đẩy ra!"
            echo "Đang dọn dẹp bộ nhớ và tự động kết nối lại sau 5 giây..."
            
            # Giải phóng hoàn toàn các tiến trình treo ngầm trước khi kết nối lại
            killall -9 ffmpeg 2>/dev/null || true
            sleep 5
          done
          
          echo "========== Hoàn thành an toàn chu kỳ 3 tiếng =========="
