name: "Live_IPTV_Sieu_Toc_Khoi"

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Chay_Luon
        env:
          INPUT_URL: "https://vietanhtv.id.vn/tv360/32/index.m3u8"
          TWITCH_KEY: ${{ secrets.TWITCH_STREAM_KEY }}
        run: |
          # Kiểm tra xem ffmpeg có sẵn không và chạy luôn
          ffmpeg -version
          
          timeout 2h50m bash -c 'while true; do
            ffmpeg -re -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -headers "Referer: https://vietanhtv.id.vn/" \
            -i "$INPUT_URL" \
            -c copy -f flv "rtmp://live.twitch.tv/app/$TWITCH_KEY"
            echo "Dang ket noi lai sau 10 giay..."
            sleep 10
          done'
