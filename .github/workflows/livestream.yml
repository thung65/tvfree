name: Stream Twitch and Save Web
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'

jobs:
  stream-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Dual Stream (Twitch + Web Files)
        run: |
          # Xóa các file cũ trước khi bắt đầu
          rm -f seg*.ts index.m3u8
          
          # FFmpeg nhận đầu vào 1 lần nhưng xuất ra 2 nơi (Twitch và File tĩnh)
          ffmpeg -re -hide_banner \
          -protocol_whitelist file,http,https,tcp,tls \
          -headers "Referer: https://vietanhtv.id.vn/" \
          -i "https://vietanhtv.id.vn/tv360/32/index.m3u8" \
          -t 300 \
          -map 0:v -map 0:a -c:v libx264 -preset veryfast -b:v 2500k -pix_fmt yuv420p \
          -map 0:v -map 0:a -c:a aac -b:a 128k \
          -f tee "[f=flv]rtmp://live.twitch.tv/app/${{ secrets.TWITCH_STREAM_KEY }}|[f=hls:hls_time=10:hls_list_size=10:hls_flags=delete_segments:hls_segment_filename=seg-%03d.ts]index.m3u8"

      - name: Push to GitHub (For Web)
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.m3u8 seg*.ts
          git add -u
          git commit --allow-empty -m "Update Stream and Cleanup: $(date)"
          git push
