name: FFmpeg Loop Testcard Force Clean
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Lấy toàn bộ lịch sử để xóa file triệt để

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Process and Force Clean
        run: |
          # 1. Lệnh xóa "mạnh tay": Xóa sạch mọi file .ts và m3u8 cũ trong kho
          git rm -f test*.ts index.m3u8 || true
          
          # 2. Chạy FFmpeg tạo luồng mới (5 phút)
          # Mình để -hls_list_size 5 để file cực nhẹ
          ffmpeg -hide_banner -loglevel error \
          -stream_loop -1 \
          -i "testcard.mp4" \
          -t 300 -c:v libx264 -c:a aac -b:a 128k -pix_fmt yuv420p \
          -f hls -hls_time 10 -hls_list_size 5 \
          -hls_flags delete_segments \
          -hls_segment_filename "test%d.ts" \
          -y index.m3u8

      - name: Commit and Force Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 3. Thêm tất cả những gì vừa tạo ra
          git add index.m3u8 test*.ts
          
          # 4. Kiểm tra xem có gì để commit không, tránh lỗi khi không có thay đổi
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Force Refresh Stream: $(date)"
            # Dùng push --force nếu cần để ghi đè hoàn toàn
            git push origin main
          else
            echo "No changes to commit"
          fi
