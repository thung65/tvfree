name: FFmpeg Loop Testcard Clean
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Loop Testcard and Auto Clean
        run: |
          # 1. Xóa toàn bộ file cũ từ lần chạy trước để làm mới hoàn toàn
          rm -f test*.ts index.m3u8
          
          # 2. Chạy FFmpeg với chế độ tự xóa segment cũ
          # -hls_flags delete_segments: Tự xóa file .ts trên ổ cứng máy ảo khi nó rời khỏi playlist
          # -hls_list_size 5: Chỉ giữ lại 5 file .ts mới nhất trong file index.m3u8
          ffmpeg -hide_banner -loglevel error \
          -stream_loop -1 \
          -i "testcard.mp4" \
          -t 300 -c:v libx264 -c:a aac -b:a 128k -pix_fmt yuv420p \
          -f hls -hls_time 10 -hls_list_size 5 \
          -hls_flags delete_segments \
          -hls_segment_filename "test%d.ts" \
          -y index.m3u8

      - name: Commit and Push (Dọn sạch kho)
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Thêm tất cả file hiện tại
          git add index.m3u8 test*.ts
          
          # 2. Lệnh quan trọng: Tự động phát hiện và xóa các file đã bị FFmpeg xóa khỏi máy ảo
          git add -u
          
          git commit --allow-empty -m "Auto Clean & Update Stream: $(date)"
          git push
