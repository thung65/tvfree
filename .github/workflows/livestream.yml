name: Stream_Pro_TV_Style

on:
  schedule:
    # Tự động chạy lại mỗi 3 tiếng để tránh giới hạn 6 tiếng của GitHub
    - cron: '0 */3 * * *' 
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg Fast
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Live Now
        env:
          STREAM_KEY: ${{ secrets.TWITCH_KEY }}
        run: |
          if [ -z "$STREAM_KEY" ]; then
            echo "⚠️ Lỗi: Không tìm thấy Secret TWITCH_KEY."
            exit 1
          fi

          SOURCE="https://sgclient.duckdns.org/source/tv360.m3u8?id=32"
          end=$((SECONDS + 10200)) # 2h50m = 10200 giây
          
          echo "========== Khởi động luồng phát FFmpeg tối ưu mới =========="
          
          while [ "$SECONDS" -lt "$end" ]
          do
            echo "---- [$(date +'%H:%M:%S')] Đang đẩy luồng sang Twitch ----"
            
            # Giữ nguyên khung cấu hình gốc của bạn nhưng đổi sang -preset ultrafast để nhẹ máy nhất
            ffmpeg -re -loglevel error \
              -fflags +genpts+discardcorrupt \
              -analyzeduration 1500000 -probesize 1000000 \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_delay_max 10 -rw_timeout 15000000 \
              -headers "Referer: https://vietanhtv.id.vn/"$'\r\n'"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              -i "$SOURCE" \
              -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 3000k -bufsize 5000k \
              -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
              -f flv "rtmps://hkg.live.twitch.tv/app/$STREAM_KEY"
            
            echo "Luồng bị ngắt. Đang dọn dẹp và tự động thử lại sau 5 giây..."
            killall -9 ffmpeg 2>/dev/null || true
            sleep 5
          done
          
          echo "========== Hoàn thành an toàn chu kỳ 3 tiếng =========="
