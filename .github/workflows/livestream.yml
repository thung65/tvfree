name: Stream_Pro_TV_Style_32

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # QUAN TRỌNG: Cấp quyền ghi vào repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stream and Sync
        run: |
          # 1. Cấu hình git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          echo "Bắt đầu chu kỳ stream..."
          
          # 2. Chạy FFmpeg nền với chế độ ghi đè (Vòng lặp 3 file)
          # -segment_wrap 3: Chỉ dùng 3 file ts (000, 001, 002) rồi ghi đè
          ffmpeg -y -re -i "https://vpsttt.vietanhtv.top/tv360/tv360.php?id=32" \
            -c copy -map 0 -f segment \
            -segment_list index.m3u8 -segment_list_flags +live \
            -segment_wrap 3 -segment_time 10 output%03d.ts &
          
          # 3. Vòng lặp cập nhật lên GitHub mỗi 60 giây
          # Cách này giúp file m3u8 luôn được update mà không cần đợi 6 tiếng
          for i in {1..359}; do
            sleep 60
            git add index.m3u8 output*.ts
            git commit -m "Auto-update stream: $(date +'%H:%M:%S')" || echo "No changes"
            git push origin main --force
          done
          
          # 4. Khi hết 6 tiếng, kết thúc job và nghỉ 1 phút
          echo "Đã hết 6 tiếng, tạm nghỉ..."
          sleep 60
