name: Stream_Pro_TV_Style

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Error And Install FFmpeg Fast
        # -y: Tự động đồng ý
        # -qq: Chạy ẩn không in log ra màn hình để tăng tốc độ
        # --no-install-recommends: Chỉ cài đúng bộ mã hóa, bỏ qua đống tài liệu phụ rườm rà
        run: |
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Live Now
        env:
          K: ${{ secrets.TWITCH_KEY }}
        run: |
          SOURCE="https://sgclient.duckdns.org/source/tv360.m3u8?id=32"
          
          end=$((SECONDS + 10200)) # Chạy trong 2 tiếng 50 phút
          
          while [ $SECONDS -lt $end ]; do
            echo "========== Khởi động luồng phát FFmpeg mới =========="
            
            ffmpeg -re \
              -fflags +genpts+discardcorrupt \
              -analyzeduration 1000000 -probesize 1000000 \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_delay_max 5 -rw_timeout 5000000 \
              -headers "Referer: https://vietanhtv.id.vn/"$'\r\n'"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"$'\r\n' \
              -i "$SOURCE" \
              -c:v libx264 -preset superfast -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://live.twitch.tv/app/$K"
            
            echo "Luồng nguồn không ổn định đã bị ngắt. Đang tự động kết nối lại sau 3 giây..."
            sleep 3
          done
          
          echo "Đã hết thời gian chạy an toàn 2h50m. Đóng job để đợi chu kỳ cron tiếp theo kích hoạt."
