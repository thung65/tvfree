name: Stream Twitch and Save Web
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */3 * * *'

jobs:
  stream-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Dual Stream (Twitch + Web Files)
        run: |
          # Xóa sạch để làm mới
          rm -f seg*.ts index.m3u8
          
          # Chạy trong 2 phút (120 giây) để test việc tạo file và đẩy lên
          # Sau 2 phút, FFmpeg sẽ dừng, và Action sẽ chuyển sang bước Push file
          ffmpeg -re -hide_banner \
          -protocol_whitelist file,http,https,tcp,tls \
          -headers "Referer: https://vietanhtv.id.vn/" \
          -i "https://vietanhtv.id.vn/tv360/32/index.m3u8" \
          -t 120 \
          -map 0:v -map 0:a -c:v libx264 -preset veryfast -b:v 2000k -pix_fmt yuv420p \
          -map 0:v -map 0:a -c:a aac -b:a 128k \
          -f tee "[f=flv]rtmp://live.twitch.tv/app/${{ secrets.TWITCH_STREAM_KEY }}|[f=hls:hls_time=10:hls_list_size=10:hls_flags=delete_segments:hls_segment_filename=seg-%03d.ts]index.m3u8"

      - name: Push to GitHub
        if: always() # Đảm bảo lệnh này luôn chạy kể cả FFmpeg có lỗi nhẹ
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.m3u8 seg*.ts
          git commit --allow-empty -m "Update Stream and Files: $(date)"
          git push origin main
