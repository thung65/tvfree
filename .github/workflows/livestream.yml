name: Stream_Pro_TV_Style

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg Standard
        run: sudo apt-get install -y ffmpeg

      - name: Live Now
        env:
          K: ${{ secrets.TWITCH_KEY }}
        run: |
          SOURCE="https://sgclient.duckdns.org/source/tv360.m3u8?id=32"
          
          if [ -z "$K" ]; then
            echo "LỖI: Chưa cấu hình TWITCH_KEY trong mục Secrets của GitHub!"
            exit 1
          fi
          
          end=$((SECONDS + 10200)) # Chạy liên tục trong 2 tiếng 50 phút
          
          while [ $SECONDS -lt $end ]; do
            echo "========== Khởi động luồng phát giả lập OBS (RTMP Cũ) =========="
            
            # Giữ nguyên link rtmp://live.twitch.tv/app/$K của bạn
            # Thêm chặn ép -user_agent ngay trước link xuất để hợp thức hóa luồng đẩy
            
            ffmpeg -re \
              -fflags +genpts+discardcorrupt \
              -analyzeduration 1000000 -probesize 1000000 \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_delay_max 5 -rw_timeout 5000000 \
              -headers "Referer: https://vietanhtv.id.vn/"$'\r\n'"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"$'\r\n' \
              -i "$SOURCE" \
              -c:v libx264 -preset superfast -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv -user_agent "FMLE/3.0 (compatible; FMSc/1.0) OBS/30.0.0" "rtmp://live.twitch.tv/app/$K"
            
            echo "Luồng chập chờn hoặc bị ngắt kết nối. Đang tự động phát lại sau 5 giây..."
            sleep 5
          done
          
          echo "Hết chu kỳ chạy an toàn."
