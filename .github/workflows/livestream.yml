name: Stream_Pro_TV_Style_32

on:
  schedule:
    - cron: '0 */6 * * *' # Chạy mỗi 6 tiếng
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Giới hạn tối đa 6 tiếng cho cả job
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Process Stream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Vòng lặp để đảm bảo tính liên tục
          # Chạy stream trong 5 tiếng 59 phút (21540 giây)
          echo "Bắt đầu chu kỳ stream..."
          
          timeout 21540 ffmpeg -y \
            -re -i "https://vpsttt.vietanhtv.top/tv360/tv360.php?id=32" \
            -c copy -map 0 -f segment \
            -segment_list index.m3u8 -segment_wrap 3 \
            -segment_time 10 output%03d.ts
            
          echo "Đã kết thúc thời gian stream 6 tiếng."
          
          # Xóa các file cũ trước khi kết thúc
          rm -f *.ts
          git add index.m3u8
          git commit -m "Cleanup: $(date)" || echo "Nothing to commit"
          git push origin main
          
          # Dừng lại 1 phút theo yêu cầu
          echo "Hệ thống tạm nghỉ 1 phút trước khi khởi động lại..."
          sleep 60
          
          echo "Hoàn thành chu kỳ."
