name: Live_Fix_Khoi

on:
  push:
  workflow_dispatch:

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: Cai_Dat_Dong_Co
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Chay_Truc_Tiep
        run: |
          ffmpeg -re -i "https://vietanhtv.id.vn/tv360/32/index.m3u8" \
          -c copy -f flv "rtmp://live.twitch.tv/app/live_1436661130_ZlbRQTC3GRCviGsoMV9QV1nh14CkoY"
