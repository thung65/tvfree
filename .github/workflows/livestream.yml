name: "Livestream IPTV TV360 - By Khoi"

on:
  schedule:
    # Cứ 5 tiếng rưỡi nổ máy lại một lần (24/7)
    - cron: '30 */5 * * *'
  workflow_dispatch: 

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Start Streaming
        env:
          # Link TV360 của Khôi
          INPUT_URL: "https://vietanhtv.id.vn/tv360/32/index.m3u8"
          # Khóa luồng Twitch của Khôi (Lấy trong Settings của Twitch)
          TWITCH_KEY: ${{ secrets.TWITCH_KEY }}
        run: |
          # Chạy trong 5 tiếng 45 phút rồi nghỉ để máy mới thay thế
          timeout 5h45m bash -c 'while true; do
            ffmpeg -re -connect_delay 10 -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$INPUT_URL" \
            -c copy -f flv "rtmp://live.twitch.tv/app/$TWITCH_KEY"
            
            echo "Nguồn bị ngắt hoặc lag, đang thử lại sau 5 giây..."
            sleep 5
          done'
