name: Stream_Pro_TV_Style

on:
  schedule:
    - cron: '0 */3 * * *' # Tự động chạy lại mỗi 3 tiếng
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  run-stream:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Quyền cực kỳ quan trọng để đẩy file lên GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Live and Web Update
        env:
          TWITCH_KEY: ${{ secrets.TWITCH_KEY }}
        run: |
          # 1. Cấu hình Git ngay từ đầu
          git config --global user.name "Trần Tất Khôi"
          git config --global user.email "action@github.com"
          git config --global pull.rebase true
          
          # 2. Xóa sạch file cũ để khởi động luồng mới
          rm -f seg*.ts index.m3u8
          
          SOURCE_URL="https://vietanhtv.id.vn/tv360/32/index.m3u8"
          
          # 3. Chạy FFmpeg ngầm (&)
          ffmpeg -re -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
          -headers "Referer: https://vietanhtv.id.vn/" \
          -i "$SOURCE_URL" \
          -t 10500 \
          -c:v libx264 -preset veryfast -b:v 1500k -pix_fmt yuv420p -g 50 \
          -c:a aac -b:a 128k -ar 44100 \
          -f tee "[f=flv]rtmp://live.twitch.tv/app/$TWITCH_KEY|[f=hls:hls_time=10:hls_list_size=10:hls_flags=delete_segments:hls_segment_filename=seg-%03d.ts]index.m3u8" &
          
          # 4. Vòng lặp cập nhật file (Cứ mỗi 3 phút đẩy lên 1 lần cho chắc)
          for i in {1..20}
          do
            sleep 180
            # Kiểm tra xem file m3u8 đã được tạo chưa mới đẩy
            if [ -f "index.m3u8" ]; then
              git add index.m3u8 seg*.ts
              git add -u
              # Chỉ commit nếu có thay đổi thực sự
              if ! git diff-index --quiet HEAD --; then
                git commit -m "Live Update: $(date)"
                # Pull về trước khi Push để tránh lỗi xung đột
                git pull origin main
                git push origin main
              fi
            fi
          done
