name: Stream_Pro_TV_Style

on:
  schedule:
    - cron: '0 */3 * * *' # Tự động chạy lại mỗi 3 tiếng
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  run-stream:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Quyền cực kỳ quan trọng để đẩy file lên GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y

      - name: Live and Generate Files
        env:
          TWITCH_KEY: ${{ secrets.TWITCH_KEY }}
        run: |
          # Xóa các file cũ để làm mới hoàn toàn
          rm -f seg*.ts index.m3u8
          
          SOURCE_URL="https://vietanhtv.id.vn/tv360/32/index.m3u8"
          
          # Giải thích lệnh FFmpeg bên dưới:
          # -t 10500: Chạy khoảng 2 tiếng 55 phút để kịp reset
          # -f tee: Chia luồng (1 lên Twitch, 1 ra file tĩnh)
          # hls_list_size=10: Giữ đúng 10 file gần nhất
          # delete_segments: Tự động xóa file cũ khi có file mới
          
          ffmpeg -re -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
          -headers "Referer: https://vietanhtv.id.vn/" \
          -i "$SOURCE_URL" \
          -t 10500 \
          -c:v libx264 -preset veryfast -b:v 2500k -pix_fmt yuv420p -g 50 \
          -c:a aac -b:a 128k -ar 44100 \
          -f tee "[f=flv]rtmp://live.twitch.tv/app/$TWITCH_KEY|[f=hls:hls_time=10:hls_list_size=10:hls_flags=delete_segments:hls_segment_filename=seg-%03d.ts]index.m3u8"

      - name: Push to GitHub (For Web Player)
        if: always() # Kể cả khi FFmpeg bị ngắt, vẫn thực hiện đẩy file lên
        run: |
          git config --global user.name "Trần Tất Khôi"
          git config --global user.email "action@github.com"
          
          # Thêm các file mới tạo
          git add index.m3u8 seg*.ts
          
          # Tự động xóa các file đã bị FFmpeg xóa khỏi danh sách
          git add -u
          
          # Kiểm tra xem có thay đổi không rồi mới push để tránh lỗi
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto Update: 10 segments for Web"
            git push origin main
          else
            echo "Không có thay đổi để cập nhật."
          fi
