name: FFmpeg Stream to M3U8
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Chạy lại mỗi 6 tiếng

jobs:
  ffmpeg-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền cho GitHub Actions ghi file vào kho của bạn
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert MPD to M3U8
        run: |
          # Ghép KID và Key thành chuỗi 64 ký tự (Không có dấu :)
          # KID: 09ddfe3d63863cafaeb79d0546b098ab
          # Key: 3de0f38dcf014827dfd5bec38743c6a2
          
          ffmpeg -hide_banner -loglevel error \
          -headers "Referer: https://mytvnet.vn/" \
          -decryption_key 09ddfe3d63863cafaeb79d0546b098ab3de0f38dcf014827dfd5bec38743c6a2 \
          -i "https://s2129134.cdn.mytvnet.vn/pkg20/live_dzones/hbo.smil/manifest.mpd" \
          -t 60 -c copy -f hls -hls_time 10 -hls_list_size 6 index.m3u8
          
          # Lưu ý: -t 60 nghĩa là ghi lại 60 giây để tạo file m3u8 mẫu.
          # Vì GitHub Actions không chạy mãi mãi được nên ta tạo file mồi.

      - name: Commit and Push index.m3u8
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.m3u8
          git commit -m "Cập nhật file index.m3u8 đã giải mã" || exit 0
          git push

