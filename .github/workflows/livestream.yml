name: Stream_Pro_TV_Style

on:
  schedule:
    # Tự động chạy lại mỗi 3 tiếng để tránh giới hạn 6 tiếng của GitHub
    - cron: '0 */3 * * *' 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg Fast
        run: |
          sudo apt-get upgrade -y
          sudo apt-get install -y ffmpeg

      - name: Live Now
        # Nạp Secret TWITCH_KEY vào biến môi trường STREAM_KEY một cách an toàn
        env:
          STREAM_KEY: ${{ secrets.TWITCH_KEY }}
        run: |
          SOURCE="https://vpsttt.vietanhtv.top/tv360/tv360.php?id=32"
          
          # Đặt tổng thời gian chạy cho toàn bộ bước này là 2 tiếng 50 phút
          end=$((SECONDS + 10200)) # 2h50m = 10200 giây
          
          while [ $SECONDS -lt $end ]; do
            echo "========== Khởi động luồng phát FFmpeg mới =========="
            
            # Đã chuyển sang rtmp://hkg.live.twitch.tv để sửa lỗi chặn kết nối và giảm giật lag
            ffmpeg -re \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_delay_max 10 -rw_timeout 15000000 \
              -headers "Referer: https://vietanhtv.id.vn/"$'\r\n'"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"$'\r\n' \
              -i "$SOURCE" \
              -c:v libx264 -preset superfast -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -f flv "rtmps://live.twitch.tv/app/$STREAM_KEY"
            
            echo "Mất kết nối với server gốc hoặc Twitch. Đang chuẩn bị thử lại sau 5 giây..."
            sleep 5
          done
          
          echo "Đã hết thời gian chạy an toàn 2h50m. Đóng job để đợi chu kỳ cron tiếp theo kích hoạt."
