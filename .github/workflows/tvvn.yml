name: Bam Mot Nut - Chay 3 Luong Tuan Tu

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */5 * * *'

jobs:
  chay-dongnai3:
    uses: ./.github/workflows/dongnai3.yml

  # 'needs' giúp luồng này đợi luồng trên chạy xong mới bắt đầu
  chay-livestream:
    needs: chay-dongnai3
    uses: ./.github/workflows/livestream.yml

  chay-static:
    needs: chay-livestream
    uses: ./.github/workflows/static.yml
