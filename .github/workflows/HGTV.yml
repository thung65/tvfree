name: Stream_Pro_TV_Style_175

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Live Now
        env:
          STREAM_KEY: ${{ secrets.TWITCH_KEY_5 }}
        run: |
          SOURCE="https://sgchill.duckdns.org/tiktok_video_2.mp4"
          
          while true; do
            echo "========== Bắt đầu phát Video (Copy luồng - không giải mã) =========="
            
            # Sử dụng -c copy để bỏ qua bước giải mã, giúp giảm tải CPU và tránh giật
            ffmpeg -y -re -stream_loop -1 \
              -i "$SOURCE" \
              -c copy -f flv "rtmp://live.twitch.tv/app/$STREAM_KEY"
            
            echo "Luồng bị ngắt. Đang khởi động lại sau 5 giây..."
            sleep 5
          done
