name: Stream_Pro_TV_Style_175

on:
  schedule:
    - cron: '0 */3 * * *' 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Live Now
        env:
          STREAM_KEY: ${{ secrets.TWITCH_KEY_5 }}
        run: |
          SOURCE="https://sgchill.duckdns.org/tiktok_video_2.mp4"
          
          # Vòng lặp tự động khôi phục nếu luồng bị ngắt
          while true; do
            echo "========== Khởi động luồng phát Video =========="
            
            ffmpeg -y -re -stream_loop -1 \
              -i "$SOURCE" \
              -c:v libx264 -preset superfast -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -f flv "rtmps://live.twitch.tv/app/$STREAM_KEY"
            
            echo "Luồng bị ngắt do lỗi mạng. Đang khởi động lại sau 5 giây..."
            sleep 5
          done

