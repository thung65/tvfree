name: Stream_Pro_TV_Style_175

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Live Now
        env:
          STREAM_KEY: ${{ secrets.TWITCH_KEY_5 }}
        run: |
          # 1. Tạo file danh sách phát các file .ts
          # Lưu ý: Thay đổi đường dẫn base_url cho đúng với link thực tế từ repo tvfree
          BASE_URL="https://raw.githubusercontent.com/thung65/tvfree/main"
          
          echo "Tạo file playlist..."
          for i in {0..13}; do
            echo "file '$BASE_URL/index$i.ts'" >> playlist.txt
          done
          
          while true; do
            echo "========== Phát danh sách index0 -> index13 =========="
            
            # Sử dụng concat demuxer để nối các file .ts
            ffmpeg -y -re -f concat -safe 0 -i playlist.txt \
              -c:v libx264 -preset ultrafast -b:v 2500k \
              -c:a aac -b:a 128k \
              -f flv "rtmp://live.twitch.tv/app/$STREAM_KEY"
            
            sleep 5
          done
