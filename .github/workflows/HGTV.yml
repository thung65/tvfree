name: Stream_Pro_TV_Style_175

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Live Now
        env:
          STREAM_KEY: ${{ secrets.TWITCH_KEY_5 }}
        run: |
          # 1. Tải từng file về thư mục gốc
          BASE_URL="https://raw.githubusercontent.com/thung65/tvfree/main"
          for i in {0..13}; do
            echo "Đang tải index$i.ts..."
            curl -L "$BASE_URL/index$i.ts" -o "index$i.ts"
          done
          
          # 2. Gộp trực tiếp tất cả vào full_stream.ts
          echo "Đang gộp file..."
          cat index0.ts index1.ts index2.ts index3.ts index4.ts index5.ts index6.ts index7.ts index8.ts index9.ts index10.ts index11.ts index12.ts index13.ts > full_stream.ts
          
          # 3. Phát luồng với loop trên file đã gộp
          while true; do
            echo "========== Đang phát full_stream.ts =========="
            
            ffmpeg -y -re -stream_loop -1 -i full_stream.ts \
              -c:v libx264 -preset ultrafast -b:v 2500k \
              -c:a aac -b:a 128k \
              -f flv "rtmp://live.twitch.tv/app/$STREAM_KEY"
            
            sleep 5
          done
